<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>(function(){try{var t=localStorage.getItem('board-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Your profile | the Board</title>
<meta name="description" content="Your profile on the Board.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="profile">

<header id="site-header"></header>

<main class="wrap pf-wrap" id="profile" aria-live="polite"></main>

<footer id="site-footer"></footer>
<noscript><div class="wrap" style="padding-block:24px">The Board needs JavaScript.</div></noscript>

<!-- Order matters: settings, demo backend (remove these two in production), API client, then the screens. -->
<script src="js/config.js"></script>
<script src="js/seed.js"></script>
<script src="js/mock-backend.js"></script>
<script src="js/api.js"></script>
<script src="js/ui-core.js"></script>
<script src="js/ui-shell.js"></script>
<script src="js/ui-theme.js"></script>
<script src="js/ui-auth.js"></script>
<script src="js/ui-browse.js"></script>
<script src="js/ui-register.js"></script>
<script src="js/ui-detail.js"></script>
<script src="js/ui-messages.js"></script>
<script src="js/ui-dashboard.js"></script>
<script src="js/ui-promo.js"></script>
<script src="js/ui-profile.js"></script>
<script src="js/main.js"></script>
</body>
</html>
