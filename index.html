<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>the Board | Student businesses and notices</title>
<meta name="description" content="One place to find student-run businesses and official notices, all in one place.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="home">

<header id="site-header"></header>

<main id="top">
  <section class="wrap browse first" id="browse" aria-labelledby="browse-h">
    <div class="browse-head">
      <h1 id="browse-h">Browse the Board</h1>
      <p>Hair, nails, food and photos from businesses run by students. Pick a category, choose the type, then search and filter.</p>
    </div>

    <form class="search" role="search" id="search-form">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <label class="sr" for="q">Search the Board</label>
      <input id="q" type="search" placeholder="Search braids, cakes, nail art" autocomplete="off">
      <button class="btn pink" type="submit">Search</button>
    </form>

    <!-- Paid placement, option C: big rotating spotlight -->
    <div class="promo-c" id="promo-c" hidden></div>

    <div class="tiles" id="tiles" role="group" aria-label="Choose a category"></div>
    <div class="catpanel" id="catpanel" hidden></div>
    <div class="filters" id="filters" hidden></div>

    <!-- Paid placement, option A: featured row above the results -->
    <div class="promo-a" id="promo-a" hidden></div>

    <div class="lanes" id="lanes" role="tablist" aria-label="Board sections"></div>
    <p class="sr" id="status" aria-live="polite"></p>
    <div class="grid" id="grid" role="tabpanel"></div>
  </section>

  <div class="marquee" role="region" aria-label="Top businesses this week"><span class="mq-label">Top businesses this week</span><div class="mq-scroll" aria-hidden="true"><div class="track" id="track"></div></div></div>

  <section class="wrap" aria-labelledby="join-h">
    <div class="banner">
      <div>
        <h2 id="join-h">Got a business? List it.</h2>
        <p>Three short steps. Free to list, always. <a href="how-it-works.html#businesses">See how listing works</a>.</p>
      </div>
      <button class="btn dark" type="button" data-open-register>Register your business</button>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>
<noscript><div class="wrap" style="padding-block:24px">The Board needs JavaScript to show listings.</div></noscript>

<!-- Order matters: settings, demo backend (remove these two in production), API client, then the screens. -->
<script src="js/config.js"></script>
<script src="js/seed.js"></script>
<script src="js/mock-backend.js"></script>
<script src="js/api.js"></script>
<script src="js/ui-core.js"></script>
<script src="js/ui-shell.js"></script>
<script src="js/ui-auth.js"></script>
<script src="js/ui-browse.js"></script>
<script src="js/ui-register.js"></script>
<script src="js/ui-detail.js"></script>
<script src="js/ui-messages.js"></script>
<script src="js/ui-dashboard.js"></script>
<script src="js/ui-promo.js"></script>
<script src="js/main.js"></script>
</body>
</html>
